name: CI & Deploy Vivo Report

on:
  push:
    branches:
      - main

concurrency:
  group: vivo-production
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Run Tests and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: |
          export SESSION_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          export INITIAL_CENTER_PASSWORD="CiPass_$(node -e "console.log(require('crypto').randomBytes(8).toString('hex'))")!"
          npm test

      - name: Verify Production Build
        run: |
          export SESSION_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          export INITIAL_CENTER_PASSWORD="CiPass_$(node -e "console.log(require('crypto').randomBytes(8).toString('hex'))")!"
          npm run build

  deploy:
    name: Deploy vivo.pdarc.space
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Vivo VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:

          host: ${{ secrets.VIVO_VPS_HOST }}
          username: ${{ secrets.VIVO_VPS_USER }}
          key: ${{ secrets.VIVO_VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "=============================="
            echo "DEPLOY VIVO REPORT SYSTEM"
            echo "=============================="

            cd /opt/vivo-report-system

            EXPECTED_REPO="https://github.com/thienbvagent/vivo-report-system.git"
            CURRENT_REPO="$(git remote get-url origin)"

            if [ "$CURRENT_REPO" != "$EXPECTED_REPO" ]; then
              echo "ERROR: Sai repository."
              echo "Expected: $EXPECTED_REPO"
              echo "Current:  $CURRENT_REPO"
              exit 1
            fi

            CURRENT_BRANCH="$(git branch --show-current)"

            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: VPS không ở branch main."
              echo "Current branch: $CURRENT_BRANCH"
              exit 1
            fi

            echo "Updating source..."

            git fetch origin main
            git reset --hard origin/main

            echo "Checking production environment..."

            docker compose config >/dev/null

            echo "Building new image..."

            docker compose build

            echo "Stopping old Vivo containers..."

            docker compose down --remove-orphans || true

            docker ps -aq --filter "name=vivo-report-app" \
              | xargs -r docker rm -f

            echo "Starting Vivo Report..."

            docker compose up -d --remove-orphans

            echo "Performing health check..."
            sleep 3
            HEALTHY=false
            for i in $(seq 1 10); do
              if curl -s http://127.0.0.1:3000/login | grep -q "vivo" 2>/dev/null; then
                echo "Health check passed!"
                HEALTHY=true
                break
              fi
              echo "Waiting for app to be ready ($i/10)..."
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Health check failed after 10 attempts!"
              docker compose logs --tail=50
              exit 1
            fi

            echo "Container status:"
            docker compose ps

            echo "=============================="
            echo "DEPLOY COMPLETED"
            echo "https://vivo.pdarc.space"
            echo "=============================="
          script: |
            set -e

            echo "=============================="
            echo "DEPLOY VIVO REPORT SYSTEM"
            echo "=============================="

            cd /opt/vivo-report-system

            EXPECTED_REPO="https://github.com/thienbvagent/vivo-report-system.git"
            CURRENT_REPO="$(git remote get-url origin)"

            if [ "$CURRENT_REPO" != "$EXPECTED_REPO" ]; then
              echo "ERROR: Sai repository."
              exit 1
            fi

            CURRENT_BRANCH="$(git branch --show-current)"

            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: VPS không ở branch main."
              exit 1
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: VPS đang có file chưa commit."
              git status
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            echo "Cleaning old Vivo containers..."

            docker compose down --remove-orphans || true

            docker ps -aq --filter "name=vivo-report-app" \
              | xargs -r docker rm -f

            echo "Building and starting Vivo..."

            docker compose up -d --build --remove-orphans

            docker compose ps

            echo "=============================="
            echo "DEPLOY COMPLETED"
            echo "https://vivo.pdarc.space"
            echo "=============================="
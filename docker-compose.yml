version: '3.8'

services:
  vivo-report-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vivo-report-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - N8N_IMPORT_WEBHOOK_URL=${N8N_IMPORT_WEBHOOK_URL:?Set N8N_IMPORT_WEBHOOK_URL}
      - N8N_QUERY_WEBHOOK_URL=${N8N_QUERY_WEBHOOK_URL:?Set N8N_QUERY_WEBHOOK_URL}
      - N8N_EXPORT_WEBHOOK_URL=${N8N_EXPORT_WEBHOOK_URL:?Set N8N_EXPORT_WEBHOOK_URL}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:?Set N8N_WEBHOOK_SECRET}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET}
      - INITIAL_CENTER_PASSWORD=${INITIAL_CENTER_PASSWORD:?Set INITIAL_CENTER_PASSWORD}
      - DB_DIR=/app/.data
    volumes:
      - vivo_data:/app/.data

volumes:
  vivo_data:
    driver: local
